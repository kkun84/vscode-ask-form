pre-commit:
  piped: true
  jobs:
    - name: format
      glob: "*.{ts,json,jsonc,md,yml,yaml,html,css}"
      run: pnpm -s exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      run: pnpm -s lint
    - name: typecheck
      run: pnpm -s typecheck
    - name: unit
      run: pnpm -s test:unit

pre-push:
  jobs:
    - name: mutation
      only:
        - run: git rev-parse --verify --quiet origin/main
      run: pnpm -s mutation:diff && pnpm -s mutation:findings origin/main
    - name: media
      only:
        - run: git rev-parse --verify --quiet origin/main
      run: node scripts/media-check.ts origin/main
