name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -euo pipefail {0}

jobs:
  detect:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      sha: ${{ steps.detect.outputs.sha }}
      action: ${{ steps.detect.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - name: Detect what to publish
        id: detect
        shell: bash -euo pipefail {0}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          MAIN=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "${MAIN%%[[:space:]]*}" != "$SHA" ]]; then
            echo "action=none" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "action=bump" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
            echo "action=release" >> "$GITHUB_OUTPUT"
          fi
  bump:
    needs: detect
    if: needs.detect.outputs.action == 'bump'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BRANCH: release/next
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          token: ${{ steps.app.outputs.token }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Bump the prerelease version
        id: prepare
        run: node scripts/release-prepare.ts
      - name: Open the release pull request
        if: steps.prepare.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          TITLE="${VERSION}をプレリリースとして配布する"
          USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "$TITLE"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          GITHUB_OUTPUT=/dev/null node scripts/release-check.ts "v$VERSION" "$RUNNER_TEMP/notes.md"
          { printf 'mainのCIが成功すると自動でマージし、プレリリースとして公開します。\n\n'; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/body.md"
          NUMBER=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [[ -z "$NUMBER" ]]; then
            gh pr create --head "$BRANCH" --base main --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$NUMBER" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
          gh pr merge "$BRANCH" --auto --squash
  release:
    needs: detect
    if: needs.detect.outputs.action == 'release'
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      SHA: ${{ needs.detect.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Check the release
        id: release
        run: node scripts/release-check.ts "$TAG" "$RUNNER_TEMP/release-notes.md"
      - name: Install
        run: |
          pnpm check-env
          pnpm install --frozen-lockfile
      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm budget
      - name: Acceptance tests
        shell: nix develop .#acceptance --command bash -euo pipefail {0}
        run: xvfb-run -a -s "-screen 0 1600x1000x24" pnpm test:acceptance --grep-invert @downloads-sdk
      - name: Package
        env:
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--pre-release); fi
          pnpm package "${args[@]}"
          sha256sum ./*.vsix > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: "*.vsix"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$TAG" ./*.vsix SHA256SUMS.txt --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --target "$SHA" "${args[@]}"
      - name: Find publishing tokens
        id: tokens
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "marketplace=${VSCE_PAT:+yes}" >> "$GITHUB_OUTPUT"
          echo "openvsx=${OVSX_PAT:+yes}" >> "$GITHUB_OUTPUT"
      - name: Publish to the Visual Studio Marketplace
        if: steps.tokens.outputs.marketplace == 'yes'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--pre-release); fi
          pnpm dlx @vscode/vsce@4.0.0 publish --packagePath ./*.vsix "${args[@]}"
      - name: Publish to Open VSX
        if: steps.tokens.outputs.openvsx == 'yes'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--pre-release); fi
          pnpm dlx ovsx@0.10.12 publish ./*.vsix "${args[@]}"
