name: Release

on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -euo pipefail {0}

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect a new version
        id: detect
        shell: bash -euo pipefail {0}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    env:
      TAG: ${{ needs.detect.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Check the release
        id: release
        run: node scripts/release-check.ts "$TAG" "$RUNNER_TEMP/release-notes.md"
      - name: Install
        run: |
          pnpm check-env
          pnpm install --frozen-lockfile
      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm budget
      - name: Acceptance tests
        shell: nix develop .#acceptance --command bash -euo pipefail {0}
        run: xvfb-run -a -s "-screen 0 1600x1000x24" pnpm test:acceptance
      - name: Package
        env:
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--pre-release); fi
          pnpm package "${args[@]}"
          sha256sum ./*.vsix > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: "*.vsix"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$TAG" ./*.vsix SHA256SUMS.txt --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA" "${args[@]}"
      - name: Find publishing tokens
        id: tokens
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "marketplace=${VSCE_PAT:+yes}" >> "$GITHUB_OUTPUT"
          echo "openvsx=${OVSX_PAT:+yes}" >> "$GITHUB_OUTPUT"
      - name: Publish to the Visual Studio Marketplace
        if: steps.tokens.outputs.marketplace == 'yes'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--pre-release); fi
          pnpm dlx @vscode/vsce@4.0.0 publish --packagePath ./*.vsix "${args[@]}"
      - name: Publish to Open VSX
        if: steps.tokens.outputs.openvsx == 'yes'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--pre-release); fi
          pnpm dlx ovsx@0.10.12 publish ./*.vsix "${args[@]}"
