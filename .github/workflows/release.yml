name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -euo pipefail {0}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Check the tag matches the version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - name: Install
        run: |
          pnpm check-env
          pnpm install --frozen-lockfile
      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm budget
      - name: Acceptance tests
        shell: nix develop .#acceptance --command bash -euo pipefail {0}
        run: xvfb-run -a -s "-screen 0 1600x1000x24" pnpm test:acceptance
      - name: Package
        run: pnpm package
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.vsix --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
      - name: Find publishing tokens
        id: tokens
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "marketplace=${VSCE_PAT:+yes}" >> "$GITHUB_OUTPUT"
          echo "openvsx=${OVSX_PAT:+yes}" >> "$GITHUB_OUTPUT"
      - name: Publish to the Visual Studio Marketplace
        if: steps.tokens.outputs.marketplace == 'yes'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm dlx @vscode/vsce@4.0.0 publish --packagePath ./*.vsix
      - name: Publish to Open VSX
        if: steps.tokens.outputs.openvsx == 'yes'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm dlx ovsx@0.10.12 publish ./*.vsix
