name: Media

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

defaults:
  run:
    shell: devshell {0}

concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recaptured:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-media') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Check that README images and the promo video were re-captured
        run: node scripts/media-check.ts "$BASE"
