name: Mutation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: devshell {0}

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutator-base
          key: mutation-base-${{ runner.os }}-${{ github.sha }}
          restore-keys: mutation-base-${{ runner.os }}-
      - name: Tests weakened by the change
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
        run: bash scripts/mutation-diff.sh "$BASE"
      - name: Judgement on a temporary repository
        if: ${{ !cancelled() }}
        run: node scripts/timed.ts mutation node_modules/.bin/vitest run --project mutation
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && hashFiles('.mutator-base/*/scopes/*.json') != '' }}
        with:
          path: .mutator-base
          key: mutation-base-${{ runner.os }}-${{ github.sha }}
