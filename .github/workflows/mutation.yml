name: Mutation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: devshell {0}

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutator
          key: mutator-${{ github.sha }}
          restore-keys: mutator-
      - name: Mutation testing of the change
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec mutator --since "origin/${GITHUB_BASE_REF}" --include-test-changes --kill-matrix --time-budget 1200 --reporter text --reporter json
          pnpm mutation:findings "origin/${GITHUB_BASE_REF}"
      - name: Mutation testing of everything
        if: github.event_name == 'push'
        run: pnpm exec mutator --time-budget 1200 --reporter text --reporter json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: .mutator
          key: mutator-${{ github.sha }}
