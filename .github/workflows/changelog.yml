name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop --command bash -euo pipefail {0}

jobs:
  entry:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Find user-visible changes
        id: changes
        shell: bash -euo pipefail {0}
        run: |
          if ! git diff --quiet "$BASE" HEAD -- src; then
            echo "visible=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        if: steps.changes.outputs.visible == 'true'
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: steps.changes.outputs.visible == 'true'
      - name: Check the changelog entry
        if: steps.changes.outputs.visible == 'true'
        run: node scripts/changelog-check.ts "$BASE"
